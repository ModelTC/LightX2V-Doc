name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check bilingual documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Read GitHub Pages URL
        id: pages
        if: vars.DOCS_PUBLISH == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build and validate both languages
        env:
          # PRs and initial setup use a test prefix until publishing is enabled.
          LIGHTX2V_DOCS_URL: ${{ steps.pages.outputs.base_url || 'https://docs.example.invalid/lightx2v/ci/' }}
          LIGHTX2V_DOCS_EDIT_URI: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}/edit/${{ github.head_ref || github.ref_name }}/docs/
        run: |
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/lightx2v-docs-site"
          python theme/check_site.py "$RUNNER_TEMP/lightx2v-docs-site" --site-url "$LIGHTX2V_DOCS_URL"
      - name: Upload the static preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightx2v-docs-preview
          path: ${{ runner.temp }}/lightx2v-docs-site
          if-no-files-found: error
          retention-days: 7
      - name: Package GitHub Pages site
        if: vars.DOCS_PUBLISH == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/lightx2v-docs-site

  deploy:
    name: Publish GitHub Pages
    if: vars.DOCS_PUBLISH == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
