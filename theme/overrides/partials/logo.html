{# One cached SVG contains the complete brand, dark ink and icon-only view. #}
<span class="lx-brand" aria-hidden="true">
  <img class="lx-brand-lockup lx-brand-lockup--light" src="{{ config.theme.logo | url }}" alt="" width="640" height="182">
  <img class="lx-brand-lockup lx-brand-lockup--dark" src="{{ config.theme.logo | url }}#dark" alt="" width="640" height="182">
  <img class="lx-brand-mark" src="{{ config.theme.logo | url }}#mark" alt="" width="172" height="182">
</span>
